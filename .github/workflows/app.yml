name: App

# iOS app build. There is no Mac in the main dev setup, so this workflow is where the iOS code is
# compiled: it generates App/CarMedya.xcodeproj with XcodeGen and builds for the iOS Simulator
# without code signing. It runs on the GitHub-hosted "xcode-27" runner (Xcode 27.0, iOS 27 SDK) so the
# iOS 27 CarPlay APIs compile; the app is built unsigned, and the CarPlay audio entitlement (granted) is
# only applied when the TestFlight workflow signs the archive.

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  ios:
    name: iOS app (Simulator, unsigned)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcodebuild -version | head -n1 | grep -q '^Xcode 27\.0' \
            || { echo "::error::Expected Xcode 27.0 at DEVELOPER_DIR"; exit 1; }

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen
          brew install xcbeautify || echo "xcbeautify unavailable; plain xcodebuild output will be used"

      - name: Package tests (CarMediaCore + CarMediaKit)
        run: swift test

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          build() {
            xcodebuild \
              -project App/CarMedya.xcodeproj \
              -scheme CarMedya \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee build/xcodebuild.log
          }
          mkdir -p build
          if command -v xcbeautify >/dev/null 2>&1; then
            build | xcbeautify
          else
            build
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  # UI smoke test: launches the real app in the iOS 27 Simulator (XCUITest), asserts the 0.7.1 screens
  # (Home "Tarayıcı" button, browser sheet, Settings > "Araç ekranında video") and keeps screenshots.
  # The CarPlay window cannot be opened headlessly (Simulator menu only), so CarPlay is not covered here.
  ui-smoke:
    name: UI smoke (Simulator launch + screenshots)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Pick an iPhone simulator (iOS 27.0)
        id: sim
        run: |
          xcrun simctl list devices available -j > build-sims.json
          UDID=$(python3 - <<'PY'
          import json
          devices = json.load(open("build-sims.json"))["devices"]
          candidates = []
          for runtime, items in devices.items():
              if "iOS-27-0" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      candidates.append(d)
          # Prefer the plain "iPhone 17"; otherwise the first iPhone on the iOS 27.0 runtime.
          candidates.sort(key=lambda d: (d["name"] != "iPhone 17", d["name"]))
          print(candidates[0]["udid"] if candidates else "")
          PY
          )
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator with the iOS 27.0 runtime"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for testing
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build
          # Unsigned, as in the "ios" job: Simulator apps and UI test runners run without a signature.
          xcodebuild build-for-testing \
            -project App/CarMedya.xcodeproj \
            -scheme CarMedya \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ui-build.log

      - name: Run UI smoke tests
        id: uitest
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project App/CarMedya.xcodeproj \
            -scheme CarMedya \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:CarMedyaUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ui.xcresult \
            2>&1 | tee build/ui-test.log

      - name: Job summary (what this job covers)
        if: always()
        env:
          OUTCOME: ${{ steps.uitest.outcome }}
        run: |
          {
            echo "### UI smoke: ${OUTCOME:-not run}"
            echo ""
            echo "Checked in the iOS 27.0 Simulator (phone UI only): Ana Sayfa 'Tarayıcı' button, browser sheet,"
            echo "Ayarlar > 'Araç ekranında video' (toggle + diagnosis). Screenshots: artifact 'ui-smoke-screenshots'."
            echo ""
            echo "**Not covered:** the CarPlay screen. A CarPlay window cannot be opened in a headless CI Simulator;"
            echo "check it by hand on a Mac (Simulator > I/O > External Displays > CarPlay) or in the car."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export screenshots
        if: always()
        run: |
          if [ ! -d build/ui.xcresult ]; then echo "No result bundle"; exit 0; fi
          mkdir -p build/ui-shots
          if xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/ui-shots; then
            # Give each file its attachment name (01-home, 02-browser, ...) using the export manifest.
            python3 - <<'PY'
          import json, os, re, shutil
          root = "build/ui-shots"
          path = os.path.join(root, "manifest.json")
          if not os.path.exists(path):
              raise SystemExit(0)
          def walk(node):
              if isinstance(node, dict):
                  exported = node.get("exportedFileName")
                  name = node.get("suggestedHumanReadableName")
                  ext = os.path.splitext(exported or "")[1].lower()
                  # Images only, with artifact-safe names (XCTest debug descriptions contain quotes).
                  if exported and name and ext in (".png", ".jpg", ".jpeg", ".heic") \
                          and os.path.exists(os.path.join(root, exported)):
                      safe = re.sub(r"[^A-Za-z0-9._-]+", "_", name)
                      if not safe.lower().endswith(ext):
                          safe += ext
                      os.makedirs(os.path.join(root, "named"), exist_ok=True)
                      shutil.copy(os.path.join(root, exported), os.path.join(root, "named", safe))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(json.load(open(path)))
          PY
            ls -la build/ui-shots build/ui-shots/named 2>/dev/null || true
          else
            echo "::warning::xcresulttool export attachments failed; the xcresult bundle is uploaded instead"
            xcrun xcresulttool help export attachments || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: build/ui-shots/named
          if-no-files-found: warn
          retention-days: 7

      - name: Upload xcresult and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-xcresult
          path: |
            build/ui.xcresult
            build/ui-build.log
            build/ui-test.log
          if-no-files-found: ignore
          retention-days: 7

  # EXPERIMENTAL, never blocks (continue-on-error). Tries to show CarMedya on a simulated CarPlay screen and
  # records what the simulated car reports for CPSessionConfiguration.supportsVideoPlayback.
  # Xcode 27 replaced Simulator.app with Device Hub, which has no CarPlay for simulators (Apple Developer
  # Forums thread 834440). This job therefore tries `simctl io <udid> screenConfig --display=<id> power on`
  # (undocumented; iOS 27 simulators still list a "CarPlay" screen in `simctl io enumerate`) and, only if a
  # Simulator.app still ships, its I/O > External Displays > CarPlay menu through System Events.
  # The app is built in Debug, ad-hoc signed so the carplay-audio entitlement is embedded, and launched with
  # -carplaySmoke (DEBUG-only hook: App/CarMedya/CarPlay/CarPlaySmoke.swift). A simulator is not a car;
  # the step summary says plainly what worked.
  carplay-sim:
    name: CarPlay simulator (experimental)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      OUT: build/carplay-sim
      BUNDLE_ID: com.bnycftc.carmedya
    steps:
      - uses: actions/checkout@v4

      - name: Tools available (simctl io, Simulator.app)
        run: |
          mkdir -p "$OUT"
          xcodebuild -version
          ls -la "$DEVELOPER_DIR/Applications" || true
          xcrun simctl help io > "$OUT/simctl-help-io.txt" 2>&1 || true
          cat "$OUT/simctl-help-io.txt"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Pick and boot an iPhone simulator (iOS 27.0)
        id: sim
        run: |
          xcrun simctl list devices available -j > build-sims.json
          UDID=$(python3 - <<'PY'
          import json
          devices = json.load(open("build-sims.json"))["devices"]
          candidates = []
          for runtime, items in devices.items():
              if "iOS-27-0" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      candidates.append(d)
          # Same choice as the ui-smoke job: the plain "iPhone 17", otherwise the first iPhone on iOS 27.0.
          candidates.sort(key=lambda d: (d["name"] != "iPhone 17", d["name"]))
          print(candidates[0]["udid"] if candidates else "")
          PY
          )
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator with the iOS 27.0 runtime"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build (Debug, ad-hoc signed so the entitlements are embedded)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # CODE_SIGNING_ALLOWED=NO (ios / ui-smoke jobs) drops the entitlements, and the Simulator does not show
          # a CarPlay app without com.apple.developer.carplay-audio. Ad-hoc ("-") needs no team or profile.
          STATUS=0
          xcodebuild build \
            -project App/CarMedya.xcodeproj \
            -scheme CarMedya \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > "$OUT/xcodebuild.log" 2>&1 || STATUS=$?
          grep -E "error:|entitlement|BUILD (SUCCEEDED|FAILED)" "$OUT/xcodebuild.log" | tail -n 60 || true
          exit $STATUS

      - name: Entitlements in the built app
        id: ent
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/CarMedya.app
          {
            echo "== codesign -d --entitlements - (signature)"
            codesign -d --entitlements - "$APP" 2>&1 || true
            echo ""
            echo "== __TEXT,__entitlements section of the executable (Simulator entitlements)"
            launchctl plist __TEXT,__entitlements "$APP/CarMedya" 2>&1 || true
          } | tee "$OUT/entitlements.txt"
          if grep -q "com.apple.developer.carplay-audio" "$OUT/entitlements.txt"; then
            echo "carplay=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::carplay-audio entitlement not found in the built app"
            echo "carplay=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and launch with -carplaySmoke
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/CarMedya.app
          # The hook (-carplaySmoke) sets onboardingCompleted and carVideoEnabled as real Bools in the app's own
          # defaults; passing them as launch arguments would shadow those with the String "YES".
          # It then starts the first video sample on the phone after 3 s, so the app is the Now Playing app
          # when the CarPlay display appears (like getting into the car while something plays).
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -carplaySmoke -showSamples YES \
            -AppleLanguages "(tr)" -AppleLocale tr_TR
          sleep 15
          xcrun simctl io "$UDID" screenshot --type=png "$OUT/01-phone-before-carplay.png" || true

      - name: Open the CarPlay display
        id: carplay
        if: always() && steps.sim.outcome == 'success'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          LOG="$OUT/carplay-open.txt"
          : > "$LOG"
          xcrun simctl io "$UDID" enumerate > "$OUT/displays-before.txt" 2>&1 || echo "simctl io enumerate failed" | tee -a "$LOG"
          cat "$OUT/displays-before.txt"
          # The CarPlay screen's id from `simctl io enumerate` (block that mentions CarPlay), else 3
          # (Xcode 27.1 lists LCD=1, TVOut=2, Wireless/CarPlay=3, Resizable=4: expo/expo-device-hub#269).
          ID=$(python3 - "$OUT/displays-before.txt" <<'PY'
          import re, sys
          # Screens are listed as "(3) Wireless:" followed by "Screen Type: CarPlay" a few lines later.
          current = None
          for line in open(sys.argv[1], errors="replace"):
              m = re.match(r"\s*\((\d+)\)\s+\S.*:\s*$", line)
              if m:
                  current = m.group(1)
              elif current and re.match(r"\s*Screen Type:\s*CarPlay\s*$", line, re.I):
                  print(current)
                  break
          PY
          )
          if [ -n "$ID" ]; then
            echo "CarPlay display id from enumerate: $ID" | tee -a "$LOG"
          else
            ID=wireless0
            echo "CarPlay display id not parsed from enumerate; trying device name wireless0" | tee -a "$LOG"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

          # Method A: simctl screenConfig (Steve Troughton-Smith, Sept 2026: powers on external displays in Xcode 27).
          echo "== A: simctl io screenConfig --display=$ID power on" | tee -a "$LOG"
          if xcrun simctl io "$UDID" screenConfig --display="$ID" power on >> "$LOG" 2>&1; then
            echo "A: command succeeded" | tee -a "$LOG"
          else
            echo "A: command failed" | tee -a "$LOG"
          fi

          # Method B: Simulator.app menu I/O > External Displays > CarPlay. bash/osascript have Accessibility and
          # AppleEvents to System Events on hosted runners (runner-images configure-tccdb-macos.sh).
          SIMAPP="$DEVELOPER_DIR/Applications/Simulator.app"
          if [ -d "$SIMAPP" ]; then
            echo "== B: Simulator.app found; clicking I/O > External Displays > CarPlay" | tee -a "$LOG"
            defaults write com.apple.iphonesimulator CarPlay -bool YES
            open -a "$SIMAPP" --args -CurrentDeviceUDID "$UDID"
            sleep 20
            if osascript >> "$LOG" 2>&1 <<'OSA'
          tell application "System Events"
            tell process "Simulator"
              set frontmost to true
              delay 1
              set ioMenu to menu 1 of menu bar item "I/O" of menu bar 1
              log (name of every menu item of ioMenu)
              click menu item "CarPlay" of menu 1 of menu item "External Displays" of ioMenu
            end tell
          end tell
          OSA
            then
              echo "B: menu click returned OK" | tee -a "$LOG"
            else
              echo "B: menu click failed" | tee -a "$LOG"
            fi
          else
            echo "== B: skipped (no Simulator.app in this Xcode; Device Hub has no CarPlay for simulators)" | tee -a "$LOG"
          fi

          # Give CarPlay time to come up and (maybe) connect CarMedya's CarPlay scene.
          sleep 30
          xcrun simctl io "$UDID" enumerate > "$OUT/displays-after.txt" 2>&1 || true
          cat "$OUT/displays-after.txt"
          cat "$LOG"

      - name: Screenshots
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ID: ${{ steps.carplay.outputs.id }}
        run: |
          xcrun simctl io "$UDID" screenshot --type=png "$OUT/02-phone.png" || true
          # CarPlay display: by id, then the older "external" alias.
          xcrun simctl io "$UDID" screenshot --type=png --display="${ID:-wireless0}" "$OUT/03-carplay.png" \
            || xcrun simctl io "$UDID" screenshot --type=png --display=wireless0 "$OUT/03-carplay.png" \
            || echo "No CarPlay display screenshot"
          screencapture -x "$OUT/04-desktop.png" || echo "screencapture failed"
          ls -la "$OUT"

      - name: Logs and diagnostics snapshot
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl spawn "$UDID" log show --last 10m --info --style compact \
            --predicate 'subsystem == "com.bnycftc.carmedya"' > "$OUT/app-log.txt" 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process CONTAINS[c] "carplay" OR subsystem CONTAINS[c] "carplay"' 2>&1 \
            | tail -n 3000 > "$OUT/system-carplay-log.txt" || true
          # Stop the app so its preferences are flushed, then decode the JSON snapshot from its data container.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          python3 - "$DATA/Library/Preferences/$BUNDLE_ID.plist" > "$OUT/carVideoSnapshot.json" 2>&1 <<'PY' || true
          import json, plistlib, sys
          try:
              prefs = plistlib.load(open(sys.argv[1], "rb"))
          except Exception as error:
              print("no app preferences:", error)
              raise SystemExit
          raw = prefs.get("carVideoSnapshot")
          print(json.dumps(json.loads(raw), indent=2) if raw else "carVideoSnapshot not set (no CarPlay connect recorded)")
          PY
          cat "$OUT/app-log.txt"
          cat "$OUT/carVideoSnapshot.json"

      - name: Job summary (what was and was not achieved)
        if: always()
        env:
          ENT: ${{ steps.ent.outputs.carplay }}
        run: |
          size() { if [ -s "$1" ]; then echo "$(wc -c < "$1" | tr -d ' ') bytes"; else echo "none"; fi; }
          LOG="$OUT/app-log.txt"
          CONNECTED=no
          grep -q "carplay-smoke.*didConnect" "$LOG" 2>/dev/null && CONNECTED=yes
          # The runner shell uses -e: a grep without a match must not end the step.
          FACTS=$(grep -o "facts: .*" "$LOG" 2>/dev/null | tail -n 1 || true)
          SUPPORTS=$(echo "$FACTS" | grep -o "supportsVideoPlayback=[a-z]*" | cut -d= -f2 || true)
          PHONE=$(grep -o "playback \[phone.*" "$LOG" 2>/dev/null | tail -n 1 || true)
          CAR=$(grep -o "playback \[carplay.*" "$LOG" 2>/dev/null | tail -n 1 || true)
          {
            echo "### CarPlay simulator (experimental, never blocks)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| carplay-audio entitlement embedded | ${ENT:-unknown} |"
            echo "| CarPlay display screenshot (03-carplay.png) | $(size "$OUT/03-carplay.png"); open it, a black image means nothing was drawn |"
            echo "| Desktop screenshot (04-desktop.png) | $(size "$OUT/04-desktop.png") |"
            echo "| CarMedya CarPlay scene connected (didConnect) | $CONNECTED |"
            echo "| supportsVideoPlayback from the simulated car | ${SUPPORTS:-not reported (scene did not connect)} |"
            echo ""
            echo "How the CarPlay display was opened:"
            echo '```'
            cat "$OUT/carplay-open.txt" 2>/dev/null || echo "(step did not run)"
            echo '```'
            echo "Last facts: \`${FACTS:-none}\`"
            echo ""
            echo "Phone playback: \`${PHONE:-none}\`"
            echo ""
            echo "CarPlay playback: \`${CAR:-none}\`"
            echo ""
            echo "A simulator is not a car: it cannot show what a real head unit reports for video. Xcode 27 officially"
            echo "supports CarPlay only with a USB-connected iPhone (Device Hub or the CarPlay Simulator app)."
            echo "Artifact: carplay-sim."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carplay-sim
          path: build/carplay-sim
          if-no-files-found: warn
          retention-days: 7

  # EXPERIMENTAL, never blocks. CarPlay on an iOS 26 simulator through Simulator.app (Xcode 26.6 on macos-26),
  # because Xcode 27's Device Hub shows a black CarPlay window (Apple Developer Forums 834440, FB24878691).
  # The app needs the iOS 27 SDK (CPSessionConfiguration.supportsVideoPlayback, CPPlaybackConfiguration), which
  # macos-26 does not have, so this job builds it on xcode-27 (Debug, arm64 Simulator, ad-hoc signed so the
  # carplay-audio entitlement is embedded) and hands it to "carplay-sim-26" as a tarball. Deployment target is
  # iOS 17, so the same binary runs on the iOS 26.x simulator; there the iOS 27 gate keeps video off.
  carplay-sim-26-build:
    name: CarPlay simulator 26, app build (Xcode 27, experimental)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      OUT: build/carplay-sim-26-app
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build (Debug, arm64 Simulator, ad-hoc signed so the entitlements are embedded)
        run: |
          mkdir -p "$OUT"
          xcodebuild -version
          # Same signing flags as the carplay-sim job. Both runners are arm64, so one Simulator arch is enough.
          STATUS=0
          xcodebuild build \
            -project App/CarMedya.xcodeproj \
            -scheme CarMedya \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > "$OUT/xcodebuild.log" 2>&1 || STATUS=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$OUT/xcodebuild.log" | tail -n 60 || true
          exit $STATUS

      - name: Pack the app (tar keeps the executable bit, which upload-artifact drops)
        run: |
          PRODUCTS=build/DerivedData/Build/Products/Debug-iphonesimulator
          launchctl plist __TEXT,__entitlements "$PRODUCTS/CarMedya.app/CarMedya" || true
          lipo -archs "$PRODUCTS/CarMedya.app/CarMedya" || true
          COPYFILE_DISABLE=1 tar -czf "$OUT/CarMedya-app.tgz" -C "$PRODUCTS" CarMedya.app
          ls -la "$OUT"

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carplay-sim-26-app
          path: build/carplay-sim-26-app
          if-no-files-found: warn
          retention-days: 3

  # EXPERIMENTAL, never blocks. Installs the app above on an iPhone simulator with the newest iOS 26.x runtime,
  # opens Simulator.app (still shipped with Xcode 26.6) and clicks I/O > External Displays > CarPlay through
  # System Events (bash/osascript have Accessibility, AppleEvents to System Events and ScreenCapture on hosted
  # runners: runner-images configure-tccdb-macos.sh). It then launches CarMedya with -carplaySmoke, optionally
  # clicks a point inside the CarPlay window (CARPLAY_TAP_X/Y, e.g. the CarMedya icon, so the CarPlay scene
  # connects) and keeps desktop/CarPlay screenshots and logs. On iOS 26 the facts line reports
  # supportsVideoPlayback=nil (iOS 27 only); this job shows the CarPlay UI, not video.
  carplay-sim-26:
    name: CarPlay simulator 26 (Simulator.app CarPlay window, experimental)
    needs: carplay-sim-26-build
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OUT: build/carplay-sim-26
      BUNDLE_ID: com.bnycftc.carmedya
      # Optional click inside the CarPlay window, in screen points from the window's top-left corner (title bar
      # included). Both empty = no click. Pick the point from carplay-window-2.png / windows.txt of a previous
      # run (if windows.txt reports a Retina display, image pixels are 2x points).
      CARPLAY_TAP_X: ""
      CARPLAY_TAP_Y: ""
    steps:
      - name: Toolchain (Xcode 26.x, Simulator.app, runtimes)
        run: |
          mkdir -p "$OUT"
          {
            xcodebuild -version
            echo "== $DEVELOPER_DIR/Applications"
            ls -la "$DEVELOPER_DIR/Applications" || true
            echo "== iOS runtimes"
            xcrun simctl list runtimes | grep -i ios || true
          } 2>&1 | tee "$OUT/toolchain.txt"
          xcodebuild -version | head -n1 | grep -q '^Xcode 26\.' \
            || echo "::warning::Expected Xcode 26.x at DEVELOPER_DIR"

      - name: Helpers (Simulator window geometry, screenshots)
        run: |
          # Title, position and size of every Simulator window, one per line (screen points, top-left origin).
          cat > "$RUNNER_TEMP/windows.applescript" <<'OSA'
          set out to ""
          tell application "System Events"
            tell process "Simulator"
              repeat with w in windows
                set n to name of w
                if n is missing value then set n to "(untitled)"
                set {x, y} to position of w
                set {ww, hh} to size of w
                set out to out & n & " | position " & x & "," & y & " | size " & ww & "," & hh & linefeed
              end repeat
            end tell
          end tell
          return out
          OSA
          # "x y w h" of the first Simulator window whose title contains "CarPlay"; empty if there is none.
          cat > "$RUNNER_TEMP/carplay-window.applescript" <<'OSA'
          tell application "System Events"
            tell process "Simulator"
              repeat with w in windows
                set n to name of w
                if n is not missing value and n contains "CarPlay" then
                  set {x, y} to position of w
                  set {ww, hh} to size of w
                  return (x as text) & " " & y & " " & ww & " " & hh
                end if
              end repeat
            end tell
          end tell
          return ""
          OSA
          # Sourced by later steps. snap <n>: desktop-n.png (whole screen), carplay-n.png (CarPlay screen from
          # simctl) and carplay-window-n.png (the Simulator CarPlay window cut out of the screen).
          cat > "$RUNNER_TEMP/cp26.sh" <<'SH'
          carplay_window() { osascript "$RUNNER_TEMP/carplay-window.applescript" 2>/dev/null || true; }
          snap() {
            local n=$1 geo
            screencapture -x "$OUT/desktop-$n.png" || echo "desktop-$n: screencapture failed"
            xcrun simctl io "$UDID" screenshot --type=png --display="${CARPLAY_DISPLAY:-external}" "$OUT/carplay-$n.png" \
              || xcrun simctl io "$UDID" screenshot --type=png --display=external "$OUT/carplay-$n.png" \
              || echo "carplay-$n: no CarPlay screenshot from simctl"
            geo=$(carplay_window)
            if [ -n "$geo" ]; then
              set -- $geo
              screencapture -x -R"$1,$2,$3,$4" "$OUT/carplay-window-$n.png" || echo "carplay-window-$n: crop failed"
            fi
            echo "snap $n: CarPlay window ${geo:-not found}"
          }
          SH

      - name: Pick and boot an iPhone simulator (newest iOS 26.x)
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          PICK=$(python3 - "$RUNNER_TEMP/sims.json" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, items in devices.items():
              # e.g. com.apple.CoreSimulator.SimRuntime.iOS-26-5 or iOS-26-4-1
              m = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not m or m.group(1) != "26":
                  continue
              phones = [d for d in items if d.get("isAvailable", True) and d["name"].startswith("iPhone")]
              if not phones:
                  continue
              # The plain "iPhone 17" if present, otherwise the first iPhone on that runtime.
              phones.sort(key=lambda d: (d["name"] != "iPhone 17", d["name"]))
              version = tuple(int(g or 0) for g in m.groups())
              if best is None or version > best[0]:
                  best = (version, phones[0])
          if best:
              print(best[1]["udid"], best[1]["name"], "iOS " + ".".join(str(v) for v in best[0]))
          PY
          )
          read -r UDID DESC <<< "$PICK" || true
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator with an iOS 26.x runtime"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $DESC ($UDID)" | tee "$OUT/simulator.txt"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Download the app built with Xcode 27
        uses: actions/download-artifact@v4
        with:
          name: carplay-sim-26-app
          path: build/app

      - name: Unpack, check entitlements, install
        id: ent
        run: |
          tar -xzf build/app/CarMedya-app.tgz -C build/app
          APP=build/app/CarMedya.app
          {
            echo "== __TEXT,__entitlements section of the executable (Simulator entitlements)"
            launchctl plist __TEXT,__entitlements "$APP/CarMedya" 2>&1 || true
            echo "== archs: $(lipo -archs "$APP/CarMedya" 2>&1 || true)"
            echo "== Info.plist"
            plutil -p "$APP/Info.plist" 2>&1 | grep -E "MinimumOSVersion|DTSDKName|DTXcode|CFBundleVersion" || true
          } | tee "$OUT/entitlements.txt"
          if grep -q "com.apple.developer.carplay-audio" "$OUT/entitlements.txt"; then
            echo "carplay=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::carplay-audio entitlement not found in the app"
            echo "carplay=no" >> "$GITHUB_OUTPUT"
          fi
          xcrun simctl install "$UDID" "$APP"

      - name: Open Simulator.app and its CarPlay window (I/O > External Displays > CarPlay)
        id: menu
        run: |
          LOG="$OUT/carplay-open.txt"
          : > "$LOG"
          SIMAPP="$DEVELOPER_DIR/Applications/Simulator.app"
          if [ ! -d "$SIMAPP" ]; then
            echo "Simulator.app not found at $SIMAPP" | tee -a "$LOG"
            echo "menu=no-simulator-app" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CarPlayExtraOptions is left off: it only adds width/height/scale choices for navigation apps
          # (Apple, "Using the CarPlay Simulator") and could put a dialog in front of the window.
          open -a "$SIMAPP" --args -CurrentDeviceUDID "$UDID"
          sleep 20
          RESULT=failed
          echo "== menu names, then click I/O > External Displays > CarPlay" >> "$LOG"
          if osascript >> "$LOG" 2>&1 <<'OSA'
          tell application "System Events"
            tell process "Simulator"
              set frontmost to true
              delay 1
              log "menu bar items:"
              log (name of every menu bar item of menu bar 1)
              set ioMenu to menu 1 of menu bar item "I/O" of menu bar 1
              log "I/O menu items:"
              log (name of every menu item of ioMenu)
              set extMenu to menu 1 of menu item "External Displays" of ioMenu
              log "External Displays items:"
              log (name of every menu item of extMenu)
              click menu item "CarPlay" of extMenu
            end tell
          end tell
          OSA
          then
            RESULT=ok
          else
            echo "== direct click failed; retrying by opening the menus one by one" >> "$LOG"
            if osascript >> "$LOG" 2>&1 <<'OSA'
          tell application "System Events"
            tell process "Simulator"
              set frontmost to true
              delay 1
              click menu bar item "I/O" of menu bar 1
              delay 1
              click menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1
              delay 1
              click menu item "CarPlay" of menu 1 of menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1
            end tell
          end tell
          OSA
            then
              RESULT=ok-after-retry
            fi
          fi
          echo "menu click: $RESULT" | tee -a "$LOG"
          echo "menu=$RESULT" >> "$GITHUB_OUTPUT"
          cat "$LOG"

      - name: Windows, displays and screenshots (before launching the app)
        run: |
          source "$RUNNER_TEMP/cp26.sh"
          sleep 15
          osascript "$RUNNER_TEMP/windows.applescript" > "$OUT/windows.txt" 2>&1 \
            || echo "listing Simulator windows failed" >> "$OUT/windows.txt"
          {
            echo "== Mac display (screen points vs. screenshot pixels)"
            system_profiler SPDisplaysDataType 2>/dev/null | grep -E "Resolution|UI Looks like|Retina|Main Display" || true
          } >> "$OUT/windows.txt"
          cat "$OUT/windows.txt"
          carplay_window > "$OUT/carplay-window.txt"
          echo "CarPlay window (x y w h, points): $(cat "$OUT/carplay-window.txt")"
          xcrun simctl io "$UDID" enumerate > "$OUT/displays.txt" 2>&1 || echo "simctl io enumerate failed" >> "$OUT/displays.txt"
          # Same parsing as the carplay-sim job: "(3) Wireless:" followed later by "Screen Type: CarPlay".
          ID=$(python3 - "$OUT/displays.txt" <<'PY'
          import re, sys
          current = None
          for line in open(sys.argv[1], errors="replace"):
              m = re.match(r"\s*\((\d+)\)\s+\S.*:\s*$", line)
              if m:
                  current = m.group(1)
              elif current and re.match(r"\s*Screen Type:\s*CarPlay\s*$", line, re.I):
                  print(current)
                  break
          PY
          )
          export CARPLAY_DISPLAY="${ID:-external}"
          echo "CARPLAY_DISPLAY=$CARPLAY_DISPLAY" >> "$GITHUB_ENV"
          echo "simctl CarPlay display: $CARPLAY_DISPLAY"
          snap 1

      - name: Launch CarMedya with -carplaySmoke
        run: |
          source "$RUNNER_TEMP/cp26.sh"
          # As in carplay-sim: the hook sets its Bool defaults itself and starts a sample on the phone after 3 s.
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -carplaySmoke -showSamples YES \
            -AppleLanguages "(tr)" -AppleLocale tr_TR
          sleep 25
          snap 2

      - name: Optional click inside the CarPlay window (CARPLAY_TAP_X / CARPLAY_TAP_Y)
        run: |
          source "$RUNNER_TEMP/cp26.sh"
          TAP="$OUT/tap.txt"
          if [ -z "$CARPLAY_TAP_X" ] || [ -z "$CARPLAY_TAP_Y" ]; then
            echo "tap: skipped (CARPLAY_TAP_X / CARPLAY_TAP_Y not set)" | tee "$TAP"
            exit 0
          fi
          case "$CARPLAY_TAP_X$CARPLAY_TAP_Y" in
            *[!0-9]*) echo "tap: skipped (CARPLAY_TAP_X / CARPLAY_TAP_Y must be whole numbers)" | tee "$TAP"; exit 0 ;;
          esac
          GEO=$(carplay_window)
          if [ -z "$GEO" ]; then
            echo "tap: skipped (no Simulator window titled CarPlay)" | tee "$TAP"
            exit 0
          fi
          set -- $GEO
          export TAP_PX=$(( $1 + CARPLAY_TAP_X ))
          export TAP_PY=$(( $2 + CARPLAY_TAP_Y ))
          echo "tap: window at $1,$2 size $3x$4, offset $CARPLAY_TAP_X,$CARPLAY_TAP_Y -> screen point $TAP_PX,$TAP_PY" | tee "$TAP"
          if osascript >> "$TAP" 2>&1 <<'OSA'
          set px to (system attribute "TAP_PX") as integer
          set py to (system attribute "TAP_PY") as integer
          tell application "System Events"
            tell process "Simulator"
              set frontmost to true
              delay 0.5
              click at {px, py}
            end tell
          end tell
          OSA
          then
            echo "tap: click returned OK" | tee -a "$TAP"
          else
            echo "tap: click failed" | tee -a "$TAP"
          fi
          sleep 20
          snap 3

      - name: Logs and diagnostics snapshot
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 10m --info --style compact \
            --predicate 'subsystem == "com.bnycftc.carmedya"' > "$OUT/app-log.txt" 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process CONTAINS[c] "carplay" OR subsystem CONTAINS[c] "carplay"' 2>&1 \
            | tail -n 3000 > "$OUT/system-carplay-log.txt" || true
          # Stop the app so its preferences are flushed, then decode the JSON snapshot from its data container.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          python3 - "$DATA/Library/Preferences/$BUNDLE_ID.plist" > "$OUT/carVideoSnapshot.json" 2>&1 <<'PY' || true
          import json, plistlib, sys
          try:
              prefs = plistlib.load(open(sys.argv[1], "rb"))
          except Exception as error:
              print("no app preferences:", error)
              raise SystemExit
          raw = prefs.get("carVideoSnapshot")
          print(json.dumps(json.loads(raw), indent=2) if raw else "carVideoSnapshot not set (no CarPlay connect recorded)")
          PY
          cat "$OUT/app-log.txt"
          cat "$OUT/carVideoSnapshot.json"

      - name: Job summary (what was and was not achieved)
        if: always()
        env:
          ENT: ${{ steps.ent.outputs.carplay }}
          MENU: ${{ steps.menu.outputs.menu }}
        run: |
          size() { if [ -s "$1" ]; then echo "$(wc -c < "$1" | tr -d ' ') bytes"; else echo "none"; fi; }
          LOG="$OUT/app-log.txt"
          CONNECTED=no
          grep -q "carplay-smoke.*didConnect" "$LOG" 2>/dev/null && CONNECTED=yes
          # The runner shell uses -e: a grep without a match must not end the step.
          FACTS=$(grep -o "facts: .*" "$LOG" 2>/dev/null | tail -n 1 || true)
          GEO=$(cat "$OUT/carplay-window.txt" 2>/dev/null || true)
          TAPLINE=$(head -n 1 "$OUT/tap.txt" 2>/dev/null || true)
          SIM=$(cat "$OUT/simulator.txt" 2>/dev/null || true)
          {
            echo "### CarPlay simulator 26 (experimental, never blocks)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Simulator | ${SIM:-not picked} |"
            echo "| carplay-audio entitlement embedded | ${ENT:-unknown} |"
            echo "| Menu I/O > External Displays > CarPlay | ${MENU:-not run} |"
            echo "| CarPlay window (x y w h, screen points) | ${GEO:-not found} |"
            echo "| simctl CarPlay display | ${CARPLAY_DISPLAY:-unknown} |"
            echo "| Click inside the CarPlay window | ${TAPLINE:-not run} |"
            echo "| CarMedya CarPlay scene connected (didConnect) | $CONNECTED |"
            echo "| carplay-window-2.png (CarPlay window after launch) | $(size "$OUT/carplay-window-2.png") |"
            echo "| carplay-2.png (simctl CarPlay screen after launch) | $(size "$OUT/carplay-2.png") |"
            echo "| desktop-2.png | $(size "$OUT/desktop-2.png") |"
            echo ""
            echo "Last facts: \`${FACTS:-none (scene did not connect)}\`"
            echo ""
            echo "On iOS 26 supportsVideoPlayback is nil by design (iOS 27 only). The CarPlay scene usually connects"
            echo "only after the CarMedya icon is tapped: set CARPLAY_TAP_X / CARPLAY_TAP_Y from carplay-window-2.png."
            echo "Artifact: carplay-sim-26."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carplay-sim-26
          path: build/carplay-sim-26
          if-no-files-found: warn
          retention-days: 7
