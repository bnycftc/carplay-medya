name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core-macos:
    name: CarMediaCore (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  core-windows:
    name: CarMediaCore (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: "6.1"
          swift-build: "6.1-RELEASE"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
