# XcodeGen spec for the CarMedya iOS app.
# The .xcodeproj is generated (and git-ignored):  cd App && xcodegen generate
# There is no Mac in the main dev setup; CI (.github/workflows/app.yml) generates and builds it on macOS.
name: CarMedya

options:
  bundleIdPrefix: com.bnycftc
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 26322AY3MH
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # The repository root is the Swift package (products CarMediaCore + CarMediaKit).
  CarMediaCore:
    path: ..

targets:
  CarMedya:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarMedya
    dependencies:
      - package: CarMediaCore
        product: CarMediaCore
      - package: CarMediaCore
        product: CarMediaKit
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
      - sdk: AVKit.framework
      - sdk: CoreLocation.framework
    settings:
      base:
        PRODUCT_NAME: CarMedya
        PRODUCT_BUNDLE_IDENTIFIER: com.bnycftc.carmedya
        INFOPLIST_FILE: Config/Info.plist
        # Only carplay-audio is used. carplay-video (granted 2026-10-15) is deliberately left out: video apps are hidden in cars without video.
        # app.yml builds with CODE_SIGNING_ALLOWED=NO; testflight.yml signs automatically (cloud signing).
        CODE_SIGN_ENTITLEMENTS: CarMedya/CarMedya.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
